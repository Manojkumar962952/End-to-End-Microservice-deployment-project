apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  
  # Service Internal URLs for Ingress & Gateway
  AUTH_SERVICE_URL: "http://auth-service:5001"
  USER_SERVICE_URL: "http://user-service:5002"
  PRODUCT_SERVICE_URL: "http://product-service:5003"
  ORDER_SERVICE_URL: "http://order-service:5004"
  PAYMENT_SERVICE_URL: "http://payment-service:5005"
  INVENTORY_SERVICE_URL: "http://inventory-service:5006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:5007"
