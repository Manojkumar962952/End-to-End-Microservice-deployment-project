apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: production
  labels:
    app: notification-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: coporate-project-notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5007
          name: http
        env:
          - name: PORT
            value: "5007"
          - name: DATABASE_URL
            value: "postgres://ecommerce_admin:admin_secure_password_2026@postgres:5432/ecommerce_notification"
          - name: RABBITMQ_URL
            value: "amqp://guest:guest@rabbitmq:5672"
        envFrom:
        - configMapRef:
            name: platform-config
        - secretRef:
            name: platform-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5007
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5007
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 5007
    targetPort: 5007
    name: http
  selector:
    app: notification-service
