# Zero-Trust Network Policy: Deny All Default Ingress/Egress & Allow Explicit Communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow Ingress Controller to route traffic to Frontend and API Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-public-services
  namespace: production
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api-gateway", "frontend"]
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 80
  egress:
  - {} # API Gateway and Frontend can route downstream
---
# Allow API Gateway to talk to Internal Microservices
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend-services
  namespace: production
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["auth-service", "user-service", "product-service", "order-service", "payment-service", "inventory-service", "notification-service"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
  egress:
  - {} # Internal services can query databases and RabbitMQ
