global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    cluster: "ecommerce-platform"

rule_files:
  - "alerting_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-service:5001"]

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["user-service:5002"]

  - job_name: "product-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["product-service:5003"]

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:5004"]

  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment-service:5005"]

  - job_name: "inventory-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory-service:5006"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification-service:5007"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
