global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'tier', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'sre-alerts-channel'
  routes:
    - match:
        severity: critical
      receiver: 'sre-pagerduty-critical'

receivers:
  - name: 'sre-alerts-channel'
    webhook_configs:
      - url: 'http://localhost:5000/api/v1/notifications/webhook'
        send_resolved: true

  - name: 'sre-pagerduty-critical'
    webhook_configs:
      - url: 'http://localhost:5000/api/v1/notifications/pagerduty'
        send_resolved: true
