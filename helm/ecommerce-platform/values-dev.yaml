# Local Development Overrides
global:
  imageRegistry: "coporate-project"
  imagePullPolicy: "Never"
  imageTag: "latest"
  environment: "development"

ingress:
  enabled: true
  host: "localhost"
  tls:
    enabled: false

# Reduced replica count and single instance for local dev
services:
  apiGateway:
    replicas: 1
    autoscaling:
      enabled: false
  authService:
    replicas: 1
  userService:
    replicas: 1
  productService:
    replicas: 1
    autoscaling:
      enabled: false
  orderService:
    replicas: 1
    autoscaling:
      enabled: false
  paymentService:
    replicas: 1
  inventoryService:
    replicas: 1
  notificationService:
    replicas: 1
  frontend:
    replicas: 1
