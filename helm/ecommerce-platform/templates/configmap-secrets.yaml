apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-config
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  LOG_LEVEL: "info"
  POSTGRES_HOST: {{ .Values.database.host | quote }}
  POSTGRES_PORT: {{ .Values.database.port | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-secrets
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  JWT_SECRET: "c3VwZXJfc2VjdXJlX2VudGVycHJpc2Vfam90X3NpZ25pbmdfa2V5XzIwMjYhQCMk"
  JWT_REFRESH_SECRET: "ZW50ZXJwcmlzZV9yZWZyZXNoX3Rva2VuX3JvdGF0aW9uX3NlY3JldF9rZXlfMjAyNg=="
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
