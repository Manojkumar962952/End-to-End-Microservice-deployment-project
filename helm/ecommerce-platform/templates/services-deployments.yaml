{{- range $key, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: "{{ $.Values.global.imageRegistry }}/ecommerce-{{ $svc.name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- if $svc.dbName }}
            - name: DATABASE_URL
              value: "postgres://{{ $.Values.database.user }}:{{ $.Values.database.password }}@{{ $.Values.database.host }}:{{ $.Values.database.port }}/{{ $svc.dbName }}"
            {{- end }}
            - name: REDIS_URL
              value: "redis://{{ $.Values.redis.host }}:{{ $.Values.redis.port }}"
            - name: RABBITMQ_URL
              value: "amqp://{{ $.Values.rabbitmq.user }}:{{ $.Values.rabbitmq.password }}@{{ $.Values.rabbitmq.host }}:{{ $.Values.rabbitmq.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "ecommerce-platform.fullname" $ }}-config
            - secretRef:
                name: {{ include "ecommerce-platform.fullname" $ }}-secrets
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ if eq $svc.name "frontend" }}/{{ else if eq $svc.name "api-gateway" }}/health/ready{{ else }}/health{{ end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ if eq $svc.name "frontend" }}/{{ else if eq $svc.name "api-gateway" }}/health/live{{ else }}/health{{ end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
  selector:
    app: {{ $svc.name }}
{{- end }}
