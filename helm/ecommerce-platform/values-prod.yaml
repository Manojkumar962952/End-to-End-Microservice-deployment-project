# Production Environment Overrides (AWS ap-south-1)
global:
  imageRegistry: "123456789012.dkr.ecr.ap-south-1.amazonaws.com"
  imagePullPolicy: "IfNotPresent"
  imageTag: "v1.0.0"
  environment: "production"

ingress:
  enabled: true
  host: "api.ecommerce.com"
  tls:
    enabled: true
    secretName: "ecommerce-api-tls-cert"

# High availability and autoscaling parameters for production
services:
  apiGateway:
    replicas: 3
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      targetCPUUtilizationPercentage: 65

  orderService:
    replicas: 3
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65

  productService:
    replicas: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
